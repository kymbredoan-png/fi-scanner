<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fi Live Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'SF Mono', 'Menlo', monospace;
      background: #000;
      color: #f3f4f6;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .camera-container {
      position: relative;
      width: 100%;
      height: 55vh;
      background: #000;
      overflow: hidden;
    }
    
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .scan-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      height: 80px;
      border: 3px solid #4ade80;
      border-radius: 8px;
      pointer-events: none;
    }
    
    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #4ade80;
      animation: scan 2s ease-in-out infinite;
    }
    
    @keyframes scan {
      0%, 100% { top: 0; }
      50% { top: calc(100% - 3px); }
    }
    
    .status-bar {
      padding: 10px;
      background: #1f2937;
      text-align: center;
      font-size: 0.85rem;
      color: #9ca3af;
    }
    
    .status-bar.found { background: #16a34a; color: white; }
    .status-bar.error { background: #dc2626; color: white; }
    .status-bar.scanning { color: #fbbf24; }
    
    .controls {
      padding: 12px;
      background: #111827;
      min-height: 45vh;
    }
    
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    
    .btn-primary { background: #16a34a; color: white; }
    .btn-stop { background: #dc2626; color: white; }
    .btn-secondary { background: #374151; color: white; }
    
    .detected-banner {
      background: #14532d;
      border: 2px solid #4ade80;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      display: none;
    }
    
    .detected-banner.show { display: block; }
    
    .detected-serial {
      font-size: 1.3rem;
      color: #4ade80;
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    
    .detected-actions { display: flex; gap: 10px; }
    .detected-actions .btn { flex: 1; margin-bottom: 0; }
    
    .btn-add { background: #16a34a; color: white; }
    .btn-skip { background: #374151; color: white; }
    
    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #374151;
    }
    
    .settings-row label { color: #9ca3af; font-size: 0.85rem; }
    
    .toggle {
      width: 50px;
      height: 28px;
      background: #374151;
      border-radius: 14px;
      position: relative;
      cursor: pointer;
    }
    
    .toggle.active { background: #16a34a; }
    
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      background: white;
      border-radius: 50%;
      transition: left 0.2s;
    }
    
    .toggle.active::after { left: 24px; }
    
    select {
      background: #374151;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
    }
    
    .manual-row {
      display: flex;
      gap: 8px;
      padding: 10px 0;
    }
    
    .manual-input {
      flex: 1;
      padding: 10px;
      background: #1f2937;
      border: 1px solid #4b5563;
      border-radius: 4px;
      color: white;
      font-family: inherit;
      font-size: 0.9rem;
    }
    
    .history-section { padding-top: 10px; }
    
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .history-header h3 { color: #9ca3af; font-size: 0.8rem; }
    
    .btn-small {
      background: #374151;
      color: #d1d5db;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      margin-left: 4px;
    }
    
    .history-list { max-height: 150px; overflow-y: auto; }
    
    .history-item {
      display: flex;
      justify-content: space-between;
      background: #1f2937;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      font-size: 0.85rem;
    }
    
    .history-serial { color: #86efac; }
    .history-time { color: #6b7280; font-size: 0.7rem; }
    
    .empty { color: #6b7280; text-align: center; padding: 15px; font-size: 0.8rem; }
    
    canvas { display: none; }
    
    .error-box {
      background: #7f1d1d;
      border: 1px solid #dc2626;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      display: none;
    }
    
    .error-box.show { display: block; }
  </style>
</head>
<body>
  <div class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <div class="scan-overlay">
      <div class="scan-line"></div>
    </div>
  </div>
  
  <div class="status-bar" id="statusBar">Tap "Start Camera" to begin</div>
  
  <canvas id="canvas"></canvas>
  
  <div class="controls">
    <div class="error-box" id="errorBox"></div>
    
    <button class="btn btn-primary" id="startBtn" onclick="toggleCamera()">📷 Start Camera</button>
    
    <div class="detected-banner" id="detectedBanner">
      <div class="detected-serial" id="detectedSerial"></div>
      <div class="detected-actions">
        <button class="btn btn-add" onclick="addDetected()">✓ Add</button>
        <button class="btn btn-skip" onclick="skipDetected()">Skip</button>
      </div>
    </div>
    
    <div class="settings-row">
      <label>Auto-scan</label>
      <div class="toggle active" id="autoToggle" onclick="toggleAuto()"></div>
    </div>
    
    <div class="settings-row">
      <label>Scan interval</label>
      <select id="intervalSelect" onchange="updateInterval()">
        <option value="1500">1.5 sec</option>
        <option value="2000">2 sec</option>
        <option value="3000" selected>3 sec</option>
      </select>
    </div>
    
    <div class="manual-row">
      <input type="text" id="manualInput" class="manual-input" placeholder="Manual entry..." oninput="this.value=this.value.toUpperCase()">
      <button class="btn btn-add" style="width:auto;margin:0;padding:10px 14px;" onclick="addManual()">Add</button>
    </div>
    
    <div class="history-section">
      <div class="history-header">
        <h3>History (<span id="count">0</span>)</h3>
        <div>
          <button class="btn-small" onclick="exportCSV()">CSV</button>
          <button class="btn-small" style="background:#7f1d1d" onclick="clearHist()">Clear</button>
        </div>
      </div>
      <div id="histList" class="history-list"><p class="empty">No scans yet</p></div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let stream = null;
    let worker = null;
    let scanTimer = null;
    let autoScan = true;
    let interval = 3000;
    let currentDetected = null;
    let processing = false;
    let history = JSON.parse(localStorage.getItem('fi-history') || '[]');
    
    renderHistory();
    
    async function toggleCamera() {
      const btn = document.getElementById('startBtn');
      hideError();
      
      if (stream) {
        // Stop
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        video.srcObject = null;
        btn.textContent = '📷 Start Camera';
        btn.className = 'btn btn-primary';
        stopScan();
        setStatus('Camera stopped');
        return;
      }
      
      // Start
      btn.textContent = '⏳ Starting...';
      btn.disabled = true;
      setStatus('Requesting camera...');
      
      try {
        // Request camera
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        
        video.srcObject = stream;
        
        // iOS requires explicit play
        await video.play();
        
        btn.textContent = '⏹ Stop Camera';
        btn.className = 'btn btn-stop';
        btn.disabled = false;
        
        setStatus('Loading OCR...');
        
        // Init Tesseract
        if (!worker) {
          worker = await Tesseract.createWorker('eng');
          await worker.setParameters({
            tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789: ',
            tessedit_pageseg_mode: '7'
          });
        }
        
        setStatus('Scanning...', 'scanning');
        if (autoScan) startScan();
        
      } catch (err) {
        console.error('Camera error:', err);
        btn.textContent = '📷 Start Camera';
        btn.className = 'btn btn-primary';
        btn.disabled = false;
        
        let msg = err.message;
        if (err.name === 'NotAllowedError') {
          msg = 'Camera permission denied. Go to Settings > Safari > Camera and allow access.';
        } else if (err.name === 'NotFoundError') {
          msg = 'No camera found on this device.';
        }
        
        showError(msg);
        setStatus('Camera error', 'error');
      }
    }
    
    function startScan() {
      stopScan();
      scanTimer = setInterval(doScan, interval);
    }
    
    function stopScan() {
      if (scanTimer) clearInterval(scanTimer);
      scanTimer = null;
    }
    
    function toggleAuto() {
      autoScan = !autoScan;
      document.getElementById('autoToggle').classList.toggle('active', autoScan);
      if (stream) {
        if (autoScan) startScan();
        else stopScan();
      }
    }
    
    function updateInterval() {
      interval = parseInt(document.getElementById('intervalSelect').value);
      if (autoScan && stream) startScan();
    }
    
    async function doScan() {
      if (!stream || processing || currentDetected) return;
      processing = true;
      
      try {
        // Capture frame
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        ctx.drawImage(video, 0, 0);
        
        // Get center strip
        const h = 120;
        const y = Math.floor((canvas.height - h) / 2);
        const imgData = ctx.getImageData(0, y, canvas.width, h);
        const d = imgData.data;
        
        // Process: invert + contrast + threshold
        for (let i = 0; i < d.length; i += 4) {
          let g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
          g = 255 - g; // invert
          g = ((g/255 - 0.5) * 2.5 + 0.5) * 255; // contrast
          g = g > 100 ? 255 : 0; // threshold
          d[i] = d[i+1] = d[i+2] = g;
        }
        
        const tmp = document.createElement('canvas');
        tmp.width = canvas.width;
        tmp.height = h;
        tmp.getContext('2d').putImageData(imgData, 0, 0);
        
        const { data: { text } } = await worker.recognize(tmp.toDataURL());
        const serials = findSerials(text);
        
        if (serials.length > 0) {
          const s = serials[0];
          if (!history.some(x => x.serial === s)) {
            currentDetected = s;
            showDetected(s);
            stopScan();
            if (navigator.vibrate) navigator.vibrate(200);
          } else {
            setStatus('Already scanned: ' + s);
          }
        }
      } catch (e) {
        console.error('Scan error:', e);
      }
      
      processing = false;
    }
    
    function findSerials(text) {
      const out = [];
      const clean = text.toUpperCase().replace(/[^A-Z0-9 :]/g, ' ');
      
      // FC35 pattern
      const m = clean.match(/FC35[A-Z0-9]{6,10}/g);
      if (m) out.push(...m);
      
      // After SN:
      const sn = /SN[: ]*([A-Z0-9]{10,14})/g;
      let x;
      while ((x = sn.exec(clean)) !== null) {
        if (!out.includes(x[1])) out.push(x[1]);
      }
      
      // Fix OCR errors
      return [...new Set(out.map(s => 
        s.replace(/^[EF][CG]/, 'FC').replace(/O/g,'0').replace(/I/g,'1')
      ))];
    }
    
    function showDetected(s) {
      document.getElementById('detectedSerial').textContent = s;
      document.getElementById('detectedBanner').classList.add('show');
      setStatus('Found: ' + s, 'found');
    }
    
    function hideDetected() {
      document.getElementById('detectedBanner').classList.remove('show');
      currentDetected = null;
      setStatus('Scanning...', 'scanning');
    }
    
    function addDetected() {
      if (currentDetected) {
        addToHistory(currentDetected);
        hideDetected();
        if (autoScan && stream) startScan();
      }
    }
    
    function skipDetected() {
      hideDetected();
      if (autoScan && stream) startScan();
    }
    
    function addManual() {
      const inp = document.getElementById('manualInput');
      const s = inp.value.replace(/[^A-Z0-9]/gi,'').toUpperCase();
      if (s.length >= 10) {
        addToHistory(s);
        inp.value = '';
      }
    }
    
    function addToHistory(serial) {
      if (history.some(x => x.serial === serial)) {
        setStatus('Duplicate');
        return;
      }
      history.unshift({ serial, timestamp: new Date().toISOString() });
      localStorage.setItem('fi-history', JSON.stringify(history));
      renderHistory();
      setStatus('Added: ' + serial);
    }
    
    function renderHistory() {
      const list = document.getElementById('histList');
      document.getElementById('count').textContent = history.length;
      
      if (!history.length) {
        list.innerHTML = '<p class="empty">No scans yet</p>';
        return;
      }
      
      list.innerHTML = history.slice(0,20).map(h => `
        <div class="history-item">
          <span class="history-serial">${h.serial}</span>
          <span class="history-time">${new Date(h.timestamp).toLocaleTimeString()}</span>
        </div>
      `).join('');
    }
    
    function clearHist() {
      if (confirm('Clear all?')) {
        history = [];
        localStorage.setItem('fi-history', '[]');
        renderHistory();
      }
    }
    
    function exportCSV() {
      if (!history.length) return;
      const csv = 'Serial,Timestamp\n' + history.map(h => h.serial+','+h.timestamp).join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
      a.download = 'fi-serials.csv';
      a.click();
    }
    
    function setStatus(msg, type = '') {
      const bar = document.getElementById('statusBar');
      bar.textContent = msg;
      bar.className = 'status-bar' + (type ? ' ' + type : '');
    }
    
    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.classList.add('show');
    }
    
    function hideError() {
      document.getElementById('errorBox').classList.remove('show');
    }
  </script>
</body>
</html>
