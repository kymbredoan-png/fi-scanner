<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fi Live Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'SF Mono', 'Menlo', monospace;
      background: #000;
      color: #f3f4f6;
      min-height: 100vh;
      overflow: hidden;
    }
    
    .camera-container {
      position: relative;
      width: 100%;
      height: 60vh;
      background: #000;
    }
    
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .scan-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 80px;
      border: 3px solid #4ade80;
      border-radius: 8px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
    }
    
    .scan-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: #4ade80;
      animation: scan 2s ease-in-out infinite;
    }
    
    @keyframes scan {
      0%, 100% { top: 0; }
      50% { top: calc(100% - 3px); }
    }
    
    .status-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px;
      background: rgba(0,0,0,0.8);
      text-align: center;
      font-size: 0.9rem;
    }
    
    .status-bar.found {
      background: rgba(22, 163, 74, 0.9);
    }
    
    .status-bar.scanning {
      color: #fbbf24;
    }
    
    .controls {
      padding: 16px;
      background: #111827;
    }
    
    .detected-banner {
      background: #14532d;
      border: 2px solid #4ade80;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      display: none;
    }
    
    .detected-banner.show {
      display: block;
      animation: pulse 0.5s ease;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    
    .detected-serial {
      font-size: 1.4rem;
      color: #4ade80;
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    
    .detected-actions {
      display: flex;
      gap: 10px;
    }
    
    .btn {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    
    .btn-add { background: #16a34a; color: white; }
    .btn-skip { background: #374151; color: white; }
    
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #374151;
    }
    
    .toggle-label { color: #9ca3af; font-size: 0.85rem; }
    
    .toggle {
      width: 50px;
      height: 28px;
      background: #374151;
      border-radius: 14px;
      position: relative;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .toggle.active { background: #16a34a; }
    
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      background: white;
      border-radius: 50%;
      transition: left 0.3s;
    }
    
    .toggle.active::after { left: 24px; }
    
    .history-section {
      max-height: 30vh;
      overflow-y: auto;
      padding: 12px 0;
    }
    
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .history-header h3 { color: #9ca3af; font-size: 0.85rem; }
    
    .btn-small {
      background: #374151;
      color: #d1d5db;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
    }
    
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1f2937;
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 4px;
    }
    
    .history-serial { color: #86efac; font-size: 0.9rem; }
    .history-time { color: #6b7280; font-size: 0.65rem; }
    
    .empty { color: #6b7280; text-align: center; padding: 20px; font-size: 0.85rem; }
    
    canvas { display: none; }
    
    .start-btn {
      width: 100%;
      padding: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    
    .camera-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #6b7280;
    }
    
    .camera-placeholder span {
      font-size: 3rem;
      margin-bottom: 10px;
    }
    
    .manual-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #374151;
    }
    
    .manual-input {
      flex: 1;
      padding: 10px;
      background: #1f2937;
      border: 1px solid #4b5563;
      border-radius: 4px;
      color: white;
      font-family: inherit;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
    
    .scan-interval {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #374151;
    }
    
    .scan-interval label { color: #9ca3af; font-size: 0.85rem; flex: 1; }
    
    .scan-interval select {
      background: #374151;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="camera-container">
    <video id="video" autoplay playsinline></video>
    <div class="scan-overlay">
      <div class="scan-line"></div>
    </div>
    <div class="camera-placeholder" id="placeholder">
      <span>📷</span>
      <p>Tap "Start Camera" below</p>
    </div>
    <div class="status-bar" id="statusBar">Ready to scan</div>
  </div>
  
  <canvas id="canvas"></canvas>
  
  <div class="controls">
    <button class="start-btn" id="startBtn" onclick="toggleCamera()">📷 Start Camera</button>
    
    <div class="detected-banner" id="detectedBanner">
      <div class="detected-serial" id="detectedSerial">FC35G085639</div>
      <div class="detected-actions">
        <button class="btn btn-add" onclick="addDetected()">✓ Add</button>
        <button class="btn btn-skip" onclick="skipDetected()">Skip</button>
      </div>
    </div>
    
    <div class="toggle-row">
      <span class="toggle-label">Auto-scan</span>
      <div class="toggle active" id="autoScanToggle" onclick="toggleAutoScan()"></div>
    </div>
    
    <div class="scan-interval">
      <label>Scan every</label>
      <select id="intervalSelect" onchange="updateInterval()">
        <option value="2000">2 sec</option>
        <option value="3000" selected>3 sec</option>
        <option value="5000">5 sec</option>
      </select>
    </div>
    
    <div class="manual-row">
      <input type="text" id="manualInput" class="manual-input" placeholder="Manual: FC35..." 
             oninput="this.value = this.value.toUpperCase()">
      <button class="btn btn-add" style="flex:0; padding: 10px 16px;" onclick="addManual()">Add</button>
    </div>
    
    <div class="history-section">
      <div class="history-header">
        <h3>Scanned (<span id="historyCount">0</span>)</h3>
        <div>
          <button class="btn-small" onclick="exportCSV()">CSV</button>
          <button class="btn-small" style="background:#7f1d1d; margin-left:4px;" onclick="clearHistory()">Clear</button>
        </div>
      </div>
      <div id="historyList"><p class="empty">No scans yet</p></div>
    </div>
  </div>

  <script>
    let video = document.getElementById('video');
    let canvas = document.getElementById('canvas');
    let ctx = canvas.getContext('2d');
    let stream = null;
    let isScanning = false;
    let autoScan = true;
    let scanInterval = 3000;
    let scanTimer = null;
    let worker = null;
    let currentDetected = null;
    let history = JSON.parse(localStorage.getItem('fi-scanner-history') || '[]');
    let isProcessing = false;
    
    renderHistory();
    
    async function toggleCamera() {
      const btn = document.getElementById('startBtn');
      const placeholder = document.getElementById('placeholder');
      
      if (stream) {
        // Stop camera
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        video.srcObject = null;
        btn.textContent = '📷 Start Camera';
        placeholder.style.display = 'flex';
        stopAutoScan();
        updateStatus('Camera stopped');
      } else {
        // Start camera
        try {
          btn.textContent = 'Starting...';
          stream = await navigator.mediaDevices.getUserMedia({
            video: { 
              facingMode: 'environment',
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });
          video.srcObject = stream;
          placeholder.style.display = 'none';
          btn.textContent = '⏹ Stop Camera';
          updateStatus('Camera ready - scanning...');
          
          // Initialize Tesseract worker
          if (!worker) {
            updateStatus('Loading OCR engine...');
            worker = await Tesseract.createWorker('eng');
            await worker.setParameters({
              tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789: ',
              tessedit_pageseg_mode: '7', // Single line mode
            });
          }
          
          if (autoScan) startAutoScan();
          
        } catch (err) {
          btn.textContent = '📷 Start Camera';
          updateStatus('Camera error: ' + err.message, true);
        }
      }
    }
    
    function startAutoScan() {
      if (scanTimer) clearInterval(scanTimer);
      scanTimer = setInterval(captureAndScan, scanInterval);
      updateStatus('Auto-scanning...');
    }
    
    function stopAutoScan() {
      if (scanTimer) {
        clearInterval(scanTimer);
        scanTimer = null;
      }
    }
    
    function toggleAutoScan() {
      autoScan = !autoScan;
      document.getElementById('autoScanToggle').classList.toggle('active', autoScan);
      
      if (autoScan && stream) {
        startAutoScan();
      } else {
        stopAutoScan();
        updateStatus('Auto-scan paused');
      }
    }
    
    function updateInterval() {
      scanInterval = parseInt(document.getElementById('intervalSelect').value);
      if (autoScan && stream) {
        startAutoScan();
      }
    }
    
    async function captureAndScan() {
      if (!stream || isProcessing || currentDetected) return;
      
      isProcessing = true;
      updateStatus('Scanning...', false, true);
      
      try {
        // Capture frame
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        
        // Get center region (where the overlay box is)
        const centerY = canvas.height * 0.5;
        const regionHeight = 150;
        const regionTop = centerY - regionHeight/2;
        
        // Extract and preprocess the scan region
        const imageData = ctx.getImageData(0, regionTop, canvas.width, regionHeight);
        
        // Create a temporary canvas for the region
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = regionHeight;
        const tempCtx = tempCanvas.getContext('2d');
        
        // Preprocess: invert and enhance (for white text on dark background)
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          // Grayscale
          let gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          
          // Invert (white text becomes black on white bg)
          gray = 255 - gray;
          
          // Increase contrast
          const contrast = 2.5;
          gray = ((gray / 255 - 0.5) * contrast + 0.5) * 255;
          gray = Math.max(0, Math.min(255, gray));
          
          // Threshold
          const value = gray > 100 ? 255 : 0;
          
          data[i] = value;
          data[i + 1] = value;
          data[i + 2] = value;
        }
        
        tempCtx.putImageData(imageData, 0, 0);
        const processedImage = tempCanvas.toDataURL('image/png');
        
        // Run OCR
        const { data: { text } } = await worker.recognize(processedImage);
        
        // Find serial numbers
        const serials = findSerials(text);
        
        if (serials.length > 0) {
          // Found one!
          const serial = serials[0];
          
          // Check if already in history
          if (!history.some(h => h.serial === serial)) {
            currentDetected = serial;
            showDetected(serial);
            stopAutoScan();
            
            // Vibrate if supported
            if (navigator.vibrate) navigator.vibrate(200);
          } else {
            updateStatus(`Already scanned: ${serial}`);
          }
        } else {
          updateStatus('Scanning...');
        }
        
      } catch (err) {
        console.error('Scan error:', err);
        updateStatus('Scan error');
      } finally {
        isProcessing = false;
      }
    }
    
    function findSerials(text) {
      const serials = [];
      const cleaned = text.toUpperCase().replace(/[^A-Z0-9\s:]/g, ' ');
      
      // FC35 pattern
      const fc35Pattern = /FC35[A-Z0-9]{6,10}/g;
      const matches = cleaned.match(fc35Pattern);
      if (matches) serials.push(...matches);
      
      // After SN:
      const snPattern = /SN[:\s]*([A-Z0-9]{10,14})/g;
      let match;
      while ((match = snPattern.exec(cleaned)) !== null) {
        if (!serials.includes(match[1])) serials.push(match[1]);
      }
      
      // Fix common OCR errors
      const fixedSerials = serials.map(s => {
        return s.replace(/^[EF][CG]/, 'FC') // EC/FG -> FC
                .replace(/O/g, '0')          // O -> 0
                .replace(/I/g, '1')          // I -> 1
                .replace(/S(?=\d)/g, '5');   // S before digit -> 5
      });
      
      return [...new Set(fixedSerials)];
    }
    
    function showDetected(serial) {
      document.getElementById('detectedSerial').textContent = serial;
      document.getElementById('detectedBanner').classList.add('show');
      document.getElementById('statusBar').classList.add('found');
      updateStatus('Serial found!');
    }
    
    function hideDetected() {
      document.getElementById('detectedBanner').classList.remove('show');
      document.getElementById('statusBar').classList.remove('found');
      currentDetected = null;
    }
    
    function addDetected() {
      if (currentDetected) {
        addToHistory(currentDetected);
        hideDetected();
        if (autoScan && stream) startAutoScan();
      }
    }
    
    function skipDetected() {
      hideDetected();
      if (autoScan && stream) startAutoScan();
    }
    
    function addManual() {
      const input = document.getElementById('manualInput');
      const serial = input.value.replace(/[^A-Z0-9]/gi, '').toUpperCase();
      
      if (serial.length >= 10) {
        addToHistory(serial);
        input.value = '';
      }
    }
    
    function addToHistory(serial) {
      if (history.some(h => h.serial === serial)) {
        updateStatus('Already in history');
        return;
      }
      
      const entry = {
        id: Date.now(),
        serial: serial,
        timestamp: new Date().toISOString()
      };
      
      history.unshift(entry);
      localStorage.setItem('fi-scanner-history', JSON.stringify(history));
      renderHistory();
      updateStatus(`Added: ${serial}`);
      
      // Sync to sheets if configured
      const sheetsUrl = localStorage.getItem('fi-scanner-sheets-url');
      if (sheetsUrl) {
        fetch(sheetsUrl, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({ serial, timestamp: entry.timestamp })
        }).catch(() => {});
      }
    }
    
    function renderHistory() {
      const list = document.getElementById('historyList');
      const count = document.getElementById('historyCount');
      
      count.textContent = history.length;
      
      if (history.length === 0) {
        list.innerHTML = '<p class="empty">No scans yet</p>';
        return;
      }
      
      list.innerHTML = history.slice(0, 20).map(h => `
        <div class="history-item">
          <div>
            <div class="history-serial">${h.serial}</div>
            <div class="history-time">${new Date(h.timestamp).toLocaleTimeString()}</div>
          </div>
        </div>
      `).join('');
    }
    
    function clearHistory() {
      if (confirm('Clear all history?')) {
        history = [];
        localStorage.setItem('fi-scanner-history', JSON.stringify(history));
        renderHistory();
      }
    }
    
    function exportCSV() {
      if (!history.length) return;
      
      const csv = ['Serial,Timestamp', ...history.map(h => `${h.serial},${h.timestamp}`)].join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `fi-serials-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    }
    
    function updateStatus(msg, isError = false, isScanning = false) {
      const bar = document.getElementById('statusBar');
      bar.textContent = msg;
      bar.classList.toggle('scanning', isScanning);
    }
  </script>
</body>
</html>
